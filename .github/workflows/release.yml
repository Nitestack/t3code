name: Release
run-name: ${{ github.repository == 'Nitestack/t3code' && inputs.channel == 'stable' && (inputs.publish && 'Fork publish stable' || 'Fork build-only stable') || 'Release stable' }} ${{ inputs.version || github.ref_name }} source ${{ inputs.source_commit || github.sha }}

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel (stable on Nitestack/t3code publishes the reviewed fork commit)"
        required: false
        default: preview
        type: choice
        options:
          - preview
          - stable
          - nightly
      version:
        description: "Stable version override (for example 1.2.3). Defaults to the version the latest nightly previewed."
        required: false
        type: string
      source_commit:
        description: Exact reviewed commit to release after it has reached fork main
        required: false
        type: string
      source_branch:
        description: CI branch that produced the successful checks for source_commit
        required: false
        type: string
      upstream_base:
        description: Full upstream commit SHA when a manual source has no upstream sync marker
        required: false
        type: string
      artifact_run_id:
        description: Successful build-only run whose locally tested installers should be published
        required: false
        type: string
      publish:
        description: Create the public tag and GitHub release after all build artifacts pass verification
        required: true
        default: false
        type: boolean

# Serialize upstream nightlies as before. Fork stable builds use their full
# source SHA so different commits cannot replace one another's pending run.
concurrency:
  group: release-${{ github.repository == 'Nitestack/t3code' && github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && format('fork-stable-{0}', inputs.source_commit || github.sha) || ((github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'preview') && 'nightly' || 'stable') }}
  cancel-in-progress: false

permissions:
  # The Windows desktop jobs read this run's artifact list to wait for the
  # Linux CLI archive they embed (see release-desktop.yml).
  actions: read
  contents: read
  id-token: none

jobs:
  fork_preflight:
    name: Fork release preflight
    if: >-
      github.repository == 'Nitestack/t3code' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      sha: ${{ steps.resolve.outputs.sha }}
      runner: ${{ steps.resolve.outputs.runner }}
      already_published: ${{ steps.resolve.outputs.already_published }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      upstream_base: ${{ steps.resolve.outputs.upstream_base }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      publication_mode: ${{ steps.resolve.outputs.publication_mode }}
    steps:
      # Fork jobs check out with plain git, like release-desktop.yml: the repo is public,
      # and checkout's credential cleanup runs `git submodule foreach`, which fails on the
      # vendored gitlinks under .repos (no .gitmodules entry), even in a sparse checkout.
      - name: Check out the release source
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - name: Verify source, CI, versions, and release identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          UPSTREAM_BASE_INPUT: ${{ inputs.upstream_base }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          AUTO_PUBLISH_ALLOWED: ${{ vars.FORK_AUTO_PUBLISH_STABLE_RELEASES == 'true' }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          publication_mode="$(node - <<'NODE'
          const { validateForkPublicationMode } = require("./.github/scripts/fork-release.cjs");
          const mode = validateForkPublicationMode({
            publish: process.env.PUBLISH_REQUESTED === "true",
            artifactRunId: process.env.ARTIFACT_RUN_ID,
            autoPublishAllowed: process.env.AUTO_PUBLISH_ALLOWED === "true",
          });
          process.stdout.write(mode);
          NODE
          )"
          git fetch --no-tags origin main:refs/remotes/origin/main
          source_sha="${SOURCE_COMMIT:-$GITHUB_SHA}"
          source_branch="${SOURCE_BRANCH:-main}"
          if git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main; then
            source_on_main=true
          else
            source_on_main=false
          fi

          ci_runs="$RUNNER_TEMP/fork-ci-runs.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$source_sha" --branch "$source_branch" \
            --json databaseId,event,headSha,headBranch,status,conclusion --limit 100 > "$ci_runs"
          ci_run_id="$(SOURCE_SHA="$source_sha" SOURCE_BRANCH="$source_branch" node - "$ci_runs" <<'NODE'
          const fs = require("node:fs");
          const { selectLatestForkCiRun } = require("./.github/scripts/fork-ci-checks.cjs");
          const runs = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const latest = selectLatestForkCiRun(runs, {
            expectedSha: process.env.SOURCE_SHA,
            expectedBranch: process.env.SOURCE_BRANCH,
          });
          process.stdout.write(String(latest.databaseId));
          NODE
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" > "$RUNNER_TEMP/fork-ci-run.json"
          gh api --paginate --jq '.jobs[] | {name, conclusion}' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" > "$RUNNER_TEMP/fork-ci-jobs.jsonl"
          SOURCE_SHA="$source_sha" SOURCE_BRANCH="$source_branch" node - \
            "$RUNNER_TEMP/fork-ci-run.json" "$RUNNER_TEMP/fork-ci-jobs.jsonl" <<'NODE'
          const fs = require("node:fs");
          const { validateForkCiRun } = require("./.github/scripts/fork-ci-checks.cjs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const jobs = fs.readFileSync(process.argv[3], "utf8").trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
          validateForkCiRun({
            run,
            jobs,
            expectedSha: process.env.SOURCE_SHA,
            expectedBranch: process.env.SOURCE_BRANCH,
          });
          NODE

          manifest_versions="$(SOURCE_SHA="$source_sha" node -e 'const cp = require("node:child_process"); const paths = { server: "apps/server/package.json", desktop: "apps/desktop/package.json", web: "apps/web/package.json", contracts: "packages/contracts/package.json" }; console.log(JSON.stringify(Object.fromEntries(Object.entries(paths).map(([name, path]) => [name, JSON.parse(cp.execFileSync("git", ["show", process.env.SOURCE_SHA + ":" + path], { encoding: "utf8" })).version]))));')"
          tag_version=""
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
          fi

          manifest_version="$(SOURCE_SHA="$source_sha" node -e 'const cp = require("node:child_process"); process.stdout.write(JSON.parse(cp.execFileSync("git", ["show", process.env.SOURCE_SHA + ":apps/server/package.json"], { encoding: "utf8" })).version)')"
          upstream_tag="v${manifest_version}"
          upstream_url="https://github.com/pingdotgg/t3code.git"
          git fetch --no-tags "$upstream_url" \
            "+refs/tags/$upstream_tag:refs/tags/fork-upstream/$upstream_tag" \
            "+refs/heads/main:refs/remotes/fork-upstream/main"
          peeled_tag_commit="$(git rev-parse --verify "refs/tags/fork-upstream/$upstream_tag^{commit}")"
          upstream_base="$(SOURCE_SHA="$source_sha" SOURCE_BRANCH="$source_branch" UPSTREAM_BASE_INPUT="$UPSTREAM_BASE_INPUT" MANIFEST_VERSION="$manifest_version" PEELED_TAG_COMMIT="$peeled_tag_commit" node - <<'NODE'
          const cp = require("node:child_process");
          const { resolveForkUpstreamBase } = require("./.github/scripts/fork-release.cjs");
          const markerPath = ".github/upstream-stable.json";
          const markerExists = cp.execFileSync("git", ["ls-tree", "--name-only", process.env.SOURCE_SHA, "--", markerPath], { encoding: "utf8" }).trim() !== "";
          const markerContents = markerExists
            ? cp.execFileSync("git", ["show", `${process.env.SOURCE_SHA}:${markerPath}`], { encoding: "utf8" })
            : undefined;
          process.stdout.write(resolveForkUpstreamBase({
            markerContents,
            explicitBase: process.env.UPSTREAM_BASE_INPUT,
            sourceBranch: process.env.SOURCE_BRANCH,
            expectedVersion: process.env.MANIFEST_VERSION,
            peeledTagCommit: process.env.PEELED_TAG_COMMIT,
          }));
          NODE
          )"
          if git merge-base --is-ancestor "$upstream_base" "$source_sha"; then
            upstream_base_is_ancestor=true
          else
            upstream_base_is_ancestor=false
          fi
          if [[ "$upstream_base_is_ancestor" != true ]]; then
            echo "::error::Upstream stable base $upstream_base is not an ancestor of fork source $source_sha."
            exit 1
          fi

          git rev-list "$upstream_base..$source_sha" > "$RUNNER_TEMP/fork-source-history.txt"
          git rev-list refs/remotes/fork-upstream/main > "$RUNNER_TEMP/upstream-main-history.txt"
          history_json="$(SOURCE_SHA="$source_sha" UPSTREAM_TAG="$upstream_tag" node - "$RUNNER_TEMP/fork-source-history.txt" "$RUNNER_TEMP/upstream-main-history.txt" <<'NODE'
          const fs = require("node:fs");
          const { analyzeForkUpstreamHistory } = require("./.github/scripts/fork-release.cjs");
          const commits = (file) => fs.readFileSync(file, "utf8").split(/\r?\n/).filter(Boolean);
          const result = analyzeForkUpstreamHistory({
            sourceRangeCommits: commits(process.argv[2]),
            upstreamMainCommits: commits(process.argv[3]),
          });
          const lines = ["### Upstream stable source history", ""];
          if (result.commits.length === 0) {
            lines.push(`No upstream-main commits beyond ${process.env.UPSTREAM_TAG} are present in this fork source.`);
          } else {
            const shortShas = result.commits.slice(0, 5).map((commit) => commit.slice(0, 12));
            lines.push(`Blocked: ${result.commits.length} upstream-main commit(s) beyond ${process.env.UPSTREAM_TAG} are present in fork source ${process.env.SOURCE_SHA}. Main accepts stable upstream tags only.`);
            lines.push(`First offending commits: ${shortShas.join(", ")}${result.commits.length > shortShas.length ? ", …" : ""}`);
            lines.push("");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n\n`);
          process.stdout.write(JSON.stringify(result));
          NODE
          )"
          if [[ "$(HISTORY_JSON="$history_json" node -e 'process.stdout.write(JSON.parse(process.env.HISTORY_JSON).blocked ? "true" : "false")')" == true ]]; then
            short_shas="$(HISTORY_JSON="$history_json" node -e 'const commits = JSON.parse(process.env.HISTORY_JSON).commits; process.stdout.write(commits.slice(0, 5).map((commit) => commit.slice(0, 12)).join(", "))')"
            count="$(HISTORY_JSON="$history_json" node -e 'process.stdout.write(String(JSON.parse(process.env.HISTORY_JSON).commits.length))')"
            echo "::error::Fork source contains $count upstream-main commit(s) beyond $upstream_tag: $short_shas. Main accepts stable upstream tags only."
            exit 1
          fi
          tag="v${tag_version:-$manifest_version}"
          remote_refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          existing_tag_sha="$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [[ -z "$existing_tag_sha" ]]; then
            existing_tag_sha="$(printf '%s\n' "$remote_refs" | awk 'NF { print $1; exit }')"
          fi

          release_exists=false
          existing_release=''
          if existing_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>"$RUNNER_TEMP/release-error")"; then
            release_exists=true
          elif grep -q "HTTP 404" "$RUNNER_TEMP/release-error"; then
            release_exists=false
          else
            echo "Could not verify whether release $tag already exists." >&2
            exit 1
          fi

          existing_assets_verified=false
          if [[ "$release_exists" == true ]]; then
            existing_release_path="$RUNNER_TEMP/existing-fork-release.json"
            existing_assets_dir="$RUNNER_TEMP/existing-fork-release-assets"
            printf '%s' "$existing_release" > "$existing_release_path"
            SOURCE_SHA="$source_sha" UPSTREAM_BASE="$upstream_base" UPSTREAM_TAG="$upstream_tag" MANIFEST_VERSION="$manifest_version" node - \
              "$existing_release_path" <<'NODE'
          const fs = require("node:fs");
          const { assertExistingForkReleaseMetadata } = require("./.github/scripts/fork-release.cjs");
          assertExistingForkReleaseMetadata({
            release: JSON.parse(fs.readFileSync(process.argv[2], "utf8")),
            version: process.env.MANIFEST_VERSION,
            sha: process.env.SOURCE_SHA,
            upstreamBase: process.env.UPSTREAM_BASE,
            upstreamTag: process.env.UPSTREAM_TAG,
              sourceBranch: process.env.SOURCE_BRANCH || "main",
          });
          NODE
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$existing_assets_dir"
            SOURCE_SHA="$source_sha" UPSTREAM_BASE="$upstream_base" UPSTREAM_TAG="$upstream_tag" MANIFEST_VERSION="$manifest_version" node - \
              "$existing_release_path" "$existing_assets_dir" <<'NODE'
          const fs = require("node:fs");
          const { verifyExistingForkReleaseAssets } = require("./.github/scripts/fork-release.cjs");
          verifyExistingForkReleaseAssets({
            release: JSON.parse(fs.readFileSync(process.argv[2], "utf8")),
            directory: process.argv[3],
            version: process.env.MANIFEST_VERSION,
            sha: process.env.SOURCE_SHA,
            upstreamBase: process.env.UPSTREAM_BASE,
            upstreamTag: process.env.UPSTREAM_TAG,
              sourceBranch: process.env.SOURCE_BRANCH || "main",
          }).catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
            existing_assets_verified=true
          fi

          export SOURCE_SHA="$source_sha" SOURCE_ON_MAIN="$source_on_main" SOURCE_BRANCH="$source_branch"
          export EXISTING_TAG_SHA="$existing_tag_sha" RELEASE_EXISTS="$release_exists"
          export EXISTING_RELEASE="$existing_release"
          export EXISTING_ASSETS_VERIFIED="$existing_assets_verified"
          export UPSTREAM_BASE="$upstream_base"
          export UPSTREAM_TAG="$upstream_tag"
          export UPSTREAM_BASE_IS_ANCESTOR="$upstream_base_is_ancestor"
          export UPSTREAM_HISTORY_JSON="$history_json"
          export PUBLICATION_MODE="$publication_mode"
          node - "$manifest_versions" <<'NODE' >> "$GITHUB_OUTPUT"
          const { resolveForkRelease } = require("./.github/scripts/fork-release.cjs");
          const result = resolveForkRelease({
            repository: process.env.GITHUB_REPOSITORY,
            eventName: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            channel: process.env.RELEASE_CHANNEL,
            requestedVersion: process.env.REQUESTED_VERSION,
            manifestVersions: JSON.parse(process.argv[2]),
            sha: process.env.SOURCE_SHA,
            sourceBranch: process.env.SOURCE_BRANCH,
            upstreamBase: process.env.UPSTREAM_BASE,
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamBaseIsAncestor: process.env.UPSTREAM_BASE_IS_ANCESTOR === "true",
            unreleasedUpstreamCommits: JSON.parse(process.env.UPSTREAM_HISTORY_JSON).commits,
            sourceOnMain: process.env.SOURCE_ON_MAIN === "true",
            existingTagSha: process.env.EXISTING_TAG_SHA,
            releaseExists: process.env.RELEASE_EXISTS === "true",
            existingRelease: process.env.EXISTING_RELEASE ? JSON.parse(process.env.EXISTING_RELEASE) : undefined,
            existingAssetsVerified: process.env.EXISTING_ASSETS_VERIFIED === "true",
          });
          for (const [key, value] of Object.entries({
            version: result.version,
            tag: result.tag,
            sha: result.sha,
            release_name: result.releaseName,
            runner: result.runner,
            already_published: result.alreadyPublished ? "true" : "false",
            artifact_name: `t3-code-installers-${result.version}-${result.sha.slice(0, 12)}`,
            upstream_base: process.env.UPSTREAM_BASE,
            upstream_tag: process.env.UPSTREAM_TAG,
            source_branch: process.env.SOURCE_BRANCH,
            publication_mode: process.env.PUBLICATION_MODE,
          })) {
            console.log(`${key}=${value}`);
          }
          NODE

  fork_android:
    name: Build signed fork Android APK
    needs: [fork_preflight]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' }}
    # GitHub validates every called job's permissions statically, including the tag-only release job.
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/mobile-android-fork.yml
    with:
      version: ${{ needs.fork_preflight.outputs.version }}
      ref: ${{ needs.fork_preflight.outputs.sha }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}

  fork_bundle:
    name: Build fork desktop bundle
    needs: [fork_preflight]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the exact fork release source
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.fork_preflight.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - name: Setup Vite+ and dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Load public build configuration
        shell: bash
        run: |
          set -euo pipefail
          # The build reads T3 Connect's public identifiers from the root .env.
          cp .env.example .env
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"

      - name: Build the platform-independent desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'process.exit(require("./package.json").scripts["build:desktop:bundle"] ? 0 : 1)'; then
            vp run build:desktop:bundle
          else
            sudo apt-get update
            sudo apt-get install -y libsecret-1-dev pkg-config
            vp run build:desktop
          fi

      - name: Upload desktop bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  fork_desktop_linux:
    name: Build Linux CLI runtime for Windows
    needs: [fork_preflight, fork_bundle]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' && needs.fork_bundle.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.fork_preflight.outputs.version }}
      ref: ${{ needs.fork_preflight.outputs.sha }}
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      relay_client_tracing: false
      fork_build_only: true

  fork_desktop_windows:
    name: Build Windows x64 installer
    needs: [fork_preflight, fork_bundle, fork_desktop_linux]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' && needs.fork_bundle.result == 'success' && needs.fork_desktop_linux.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.fork_preflight.outputs.version }}
      ref: ${{ needs.fork_preflight.outputs.sha }}
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      relay_client_tracing: false
      fork_build_only: true

  # No Apple secrets reach this job, so the app is built without Developer ID
  # signing; install-macos.sh installs it without a Gatekeeper prompt.
  fork_desktop_mac:
    name: Build macOS arm64 app
    needs: [fork_preflight, fork_bundle]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' && needs.fork_bundle.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.fork_preflight.outputs.version }}
      ref: ${{ needs.fork_preflight.outputs.sha }}
      release_channel: stable
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: false
      launch_check: true
      relay_client_tracing: false
      fork_build_only: true

  fork_nix:
    name: Build versioned fork Nix package
    needs: [fork_preflight]
    if: ${{ !failure() && !cancelled() && inputs.artifact_run_id == '' && needs.fork_preflight.result == 'success' && needs.fork_preflight.outputs.already_published != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      store_path: ${{ steps.build.outputs.store_path }}
    steps:
      - name: Check out the exact fork release source
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.fork_preflight.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Build and verify the matching Nix package
        id: build
        env:
          EXPECTED_VERSION: ${{ needs.fork_preflight.outputs.version }}
          EXPECTED_SHA: ${{ needs.fork_preflight.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_name="t3code-${EXPECTED_VERSION}"
          actual_name="$(nix eval --raw .#t3code.name)"
          if [[ "$actual_name" != "$expected_name" ]]; then
            echo "::error::Nix package name $actual_name does not match $expected_name."
            exit 1
          fi
          nix build .#t3code --no-link --print-out-paths --print-build-logs > "$RUNNER_TEMP/nix-build-output"
          store_path="$(cat "$RUNNER_TEMP/nix-build-output")"
          if [[ ! "$store_path" =~ ^/nix/store/[a-z0-9]{32}-t3code-${EXPECTED_VERSION}$ ]]; then
            echo "::error::Nix did not return the expected versioned store path."
            exit 1
          fi
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"
          NIX_PACKAGE_NAME="$actual_name" node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const { buildForkNixBuildSummary } = require("./.github/scripts/fork-release.cjs");
          process.stdout.write(buildForkNixBuildSummary({
            packageName: process.env.NIX_PACKAGE_NAME,
            sourceSha: process.env.EXPECTED_SHA,
          }));
          NODE

  fork_build_artifacts:
    name: Verify and package fork installers
    needs: [fork_preflight, fork_android, fork_desktop_windows, fork_desktop_mac, fork_nix]
    if: >-
      !failure() && !cancelled() &&
      inputs.artifact_run_id == '' &&
      needs.fork_preflight.result == 'success' &&
      needs.fork_preflight.outputs.already_published != 'true' &&
      needs.fork_android.result == 'success' &&
      needs.fork_desktop_windows.result == 'success' &&
      needs.fork_desktop_mac.result == 'success' &&
      needs.fork_nix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the trusted release verifier
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - name: Download signed Android build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3-code-android-${{ github.run_id }}
          path: incoming/android

      - name: Download Windows installer build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: incoming/windows

      - name: Download macOS app build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: incoming/mac

      - name: Verify both installers and prepare a build-only artifact
        env:
          EXPECTED_VERSION: ${{ needs.fork_preflight.outputs.version }}
          EXPECTED_SHA: ${{ needs.fork_preflight.outputs.sha }}
          UPSTREAM_BASE: ${{ needs.fork_preflight.outputs.upstream_base }}
          UPSTREAM_TAG: ${{ needs.fork_preflight.outputs.upstream_tag }}
          SOURCE_BRANCH: ${{ needs.fork_preflight.outputs.source_branch }}
          ARTIFACT_NAME: ${{ needs.fork_preflight.outputs.artifact_name }}
          NIX_STORE_PATH: ${{ needs.fork_nix.outputs.store_path }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLICATION_MODE: ${{ needs.fork_preflight.outputs.publication_mode }}
        shell: bash
        run: |
          set -euo pipefail
          apk="incoming/android/T3-Code-${EXPECTED_VERSION}.apk"
          windows_meta="incoming/windows/windows-metadata.json"
          android_meta="incoming/android/metadata.json"
          installers=(incoming/windows/*.exe)
          if [[ ${#installers[@]} -ne 1 || ! -f "$apk" || ! -f "$windows_meta" || ! -f "$android_meta" ]]; then
            echo "Expected one Windows installer, one signed APK, and both build metadata files." >&2
            exit 1
          fi

          (cd incoming/android && sha256sum --check "$(basename "$apk").sha256")
          (cd incoming/windows && sha256sum --check "$(basename "${installers[0]}").sha256")
          node - "$android_meta" "$windows_meta" "${installers[0]}" <<'NODE'
          const fs = require("node:fs");
          const [androidPath, windowsPath, installerPath] = process.argv.slice(2);
          const android = JSON.parse(fs.readFileSync(androidPath, "utf8"));
          const windows = JSON.parse(fs.readFileSync(windowsPath, "utf8"));
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedSha = process.env.EXPECTED_SHA;
          if (android.applicationId !== "com.t3tools.t3code" || android.versionName !== expectedVersion || android.gitSha !== expectedSha) {
            throw new Error("Android metadata does not match the selected release source.");
          }
          if (windows.version !== expectedVersion || windows.gitSha !== expectedSha || windows.architecture !== "x64" || windows.installer !== require("node:path").basename(installerPath)) {
            throw new Error("Windows metadata does not match the selected release source.");
          }
          if (!["signed", "unsigned"].includes(windows.windowsSigning)) {
            throw new Error("Windows signing status is missing or unrecognized.");
          }
          NODE

          mkdir -p release-assets
          windows_name="T3-Code-${EXPECTED_VERSION}-x64.exe"
          cp "${installers[0]}" "release-assets/$windows_name"
          (cd release-assets && sha256sum "$windows_name" > "$windows_name.sha256")
          cp "$apk" release-assets/
          cp "incoming/android/$(basename "$apk").sha256" release-assets/
          cp "$android_meta" release-assets/metadata.json
          cp "$windows_meta" release-assets/windows-metadata.json

          # install-macos.sh downloads the zip by this fixed name.
          for ext in dmg zip; do
            mac_builds=(incoming/mac/*."$ext")
            if [[ ${#mac_builds[@]} -ne 1 ]]; then
              echo "Expected one macOS .$ext, found ${#mac_builds[@]}." >&2
              exit 1
            fi
            mac_name="T3-Code-${EXPECTED_VERSION}-arm64.$ext"
            cp "${mac_builds[0]}" "release-assets/$mac_name"
            (cd release-assets && sha256sum "$mac_name" > "$mac_name.sha256")
          done
          cp .github/scripts/install-macos.sh release-assets/install-macos.sh

          EXPECTED_SHA="$EXPECTED_SHA" UPSTREAM_BASE="$UPSTREAM_BASE" UPSTREAM_TAG="$UPSTREAM_TAG" BUILD_RUN_ID="$BUILD_RUN_ID" BUILD_RUN_ATTEMPT="$BUILD_RUN_ATTEMPT" node - <<'NODE'
          const fs = require("node:fs");
          const { buildForkArtifactSourceMetadata } = require("./.github/scripts/fork-release.cjs");
          const metadata = buildForkArtifactSourceMetadata({
            sha: process.env.EXPECTED_SHA,
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamBase: process.env.UPSTREAM_BASE,
            buildRunId: process.env.BUILD_RUN_ID,
            buildRunAttempt: process.env.BUILD_RUN_ATTEMPT,
          });
          for (const file of ["metadata.json", "windows-metadata.json"]) {
            const current = JSON.parse(fs.readFileSync(`release-assets/${file}`, "utf8"));
            fs.writeFileSync(`release-assets/${file}`, `${JSON.stringify({ ...current, ...metadata }, null, 2)}\n`);
          }
          NODE

          node - "$NIX_STORE_PATH" <<'NODE'
          const fs = require("node:fs");
          const { buildForkArtifactSourceMetadata } = require("./.github/scripts/fork-release.cjs");
          const [storePath] = process.argv.slice(2);
          if (!/^\/nix\/store\/[a-z0-9]{32}-t3code-\d+\.\d+\.\d+$/.test(storePath)) {
            throw new Error("Nix build output is not a verified versioned package path.");
          }
          fs.writeFileSync("release-assets/nix-build.json", `${JSON.stringify({
            package: "t3code",
            version: process.env.EXPECTED_VERSION,
            gitSha: process.env.EXPECTED_SHA,
            storePath,
            ...buildForkArtifactSourceMetadata({
              sha: process.env.EXPECTED_SHA,
              upstreamTag: process.env.UPSTREAM_TAG,
              upstreamBase: process.env.UPSTREAM_BASE,
              buildRunId: process.env.BUILD_RUN_ID,
              buildRunAttempt: process.env.BUILD_RUN_ATTEMPT,
            }),
          }, null, 2)}\n`);
          NODE

          node - release-assets/windows-metadata.json "$windows_name" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const meta = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          meta.installer = process.argv[3];
          meta.sha256 = fs.readFileSync(path.join("release-assets", `${process.argv[3]}.sha256`), "utf8").split(" ")[0];
          fs.writeFileSync("release-assets/windows-metadata.json", `${JSON.stringify(meta, null, 2)}\n`);
          NODE

          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA="$EXPECTED_SHA" UPSTREAM_BASE="$UPSTREAM_BASE" UPSTREAM_TAG="$UPSTREAM_TAG" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_RUN_ID="$BUILD_RUN_ID" BUILD_RUN_ATTEMPT="$BUILD_RUN_ATTEMPT" node - <<'NODE'
          const fs = require("node:fs");
          const { buildForkBuildInfo } = require("./.github/scripts/fork-release.cjs");
          fs.writeFileSync("release-assets/BUILD-INFO.md", buildForkBuildInfo({
            version: process.env.EXPECTED_VERSION,
            sha: process.env.EXPECTED_SHA,
            upstreamTag: process.env.UPSTREAM_TAG,
            upstreamBase: process.env.UPSTREAM_BASE,
            sourceBranch: process.env.SOURCE_BRANCH,
            buildRunId: process.env.BUILD_RUN_ID,
            buildRunAttempt: process.env.BUILD_RUN_ATTEMPT,
            publicationMode: process.env.PUBLICATION_MODE,
          }));
          NODE

          {
            printf 'Build-only artifact: %s\n' "$ARTIFACT_NAME"
            printf 'Fork commit (built source): %s\n' "$EXPECTED_SHA"
            printf 'Upstream stable base: %s = %s\n' "$UPSTREAM_TAG" "$UPSTREAM_BASE"
            printf 'These artifacts are built from the fork commit and include fork changes plus upstream through %s.\n' "$UPSTREAM_TAG"
            if [[ "$PUBLICATION_MODE" == "build-only" ]]; then
              printf 'No tag or release was created.\n'
            else
              printf 'Authorized publication proceeds only after final artifact verification.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows, macOS, and Android installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.fork_preflight.outputs.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  fork_verify_tested_artifact:
    name: Verify tested build-only artifact
    needs: [fork_preflight]
    if: >-
      github.repository == 'Nitestack/t3code' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && inputs.publish == true &&
      inputs.artifact_run_id != '' &&
      !failure() && !cancelled() &&
      needs.fork_preflight.result == 'success' &&
      needs.fork_preflight.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      build_run_attempt: ${{ steps.verify.outputs.build_run_attempt }}
    steps:
      - name: Check out the trusted release verifier
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - id: verify
        name: Verify the exact successful build-only run and artifact
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_VERSION: ${{ needs.fork_preflight.outputs.version }}
          EXPECTED_SHA: ${{ needs.fork_preflight.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::artifact_run_id must be a positive integer."
            exit 1
          fi
          run_json="$RUNNER_TEMP/fork-build-only-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" > "$run_json"
          attempt="$(node -e 'const run = require(process.argv[1]); process.stdout.write(String(run.run_attempt));' "$run_json")"
          if [[ ! "$attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Selected artifact run has no valid completed attempt."
            exit 1
          fi
          jobs_jsonl="$RUNNER_TEMP/fork-build-only-jobs.jsonl"
          artifacts_jsonl="$RUNNER_TEMP/fork-build-only-artifacts.jsonl"
          gh api --paginate --jq '.jobs[] | {name, conclusion}' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/attempts/$attempt/jobs?per_page=100" > "$jobs_jsonl"
          gh api --paginate --jq '.artifacts[] | {name, expired, size_in_bytes}' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" > "$artifacts_jsonl"
          EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_SHA="$EXPECTED_SHA" ARTIFACT_RUN_ID="$ARTIFACT_RUN_ID" \
            node - "$run_json" "$jobs_jsonl" "$artifacts_jsonl" <<'NODE'
          const fs = require("node:fs");
          const { validateForkBuildOnlyRun } = require("./.github/scripts/fork-release.cjs");
          const jsonLines = (filename) =>
            fs.readFileSync(filename, "utf8").split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const result = validateForkBuildOnlyRun({
            run: JSON.parse(fs.readFileSync(process.argv[2], "utf8")),
            jobs: jsonLines(process.argv[3]),
            artifacts: jsonLines(process.argv[4]),
            expectedRunId: process.env.ARTIFACT_RUN_ID,
            version: process.env.EXPECTED_VERSION,
            sha: process.env.EXPECTED_SHA,
          });
          process.stdout.write(`Verified ${result.artifactName} from build-only run ${result.runId}.\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build_run_attempt=${result.runAttempt}\n`);
          NODE
          artifact_name="t3-code-installers-${EXPECTED_VERSION}-${EXPECTED_SHA:0:12}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'The exact tested build-only artifact from run %s is ready for promotion.\n' "$ARTIFACT_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  fork_publish:
    name: Publish authorized fork release
    needs: [fork_preflight, fork_build_artifacts, fork_nix, fork_verify_tested_artifact]
    if: >-
      github.repository == 'Nitestack/t3code' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && inputs.publish == true &&
      !failure() && !cancelled() &&
      needs.fork_preflight.result == 'success' &&
      needs.fork_preflight.outputs.already_published != 'true' &&
      (
        (
          needs.fork_preflight.outputs.publication_mode == 'promote-tested-artifact' &&
          needs.fork_verify_tested_artifact.result == 'success'
        ) ||
        (
          needs.fork_preflight.outputs.publication_mode == 'authorized-auto-publish' &&
          needs.fork_build_artifacts.result == 'success' &&
          needs.fork_nix.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the trusted release verifier
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      - name: Download installers from this authorized auto-publication run
        if: inputs.artifact_run_id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.fork_preflight.outputs.artifact_name }}
          path: release-assets

      - name: Download the exact tested build-only installers
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.fork_verify_tested_artifact.outputs.artifact_name }}
          path: release-assets
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      # GITHUB_TOKEN cannot point refs at a commit whose workflows differ from main.
      # Without the App's workflows grant, a maintainer pushes the tag and branch first.
      - id: release_app_token
        name: Mint fork release App token
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FORK_SYNC_APP_ID }}
          private-key: ${{ secrets.FORK_SYNC_APP_PRIVATE_KEY }}
          owner: Nitestack
          repositories: t3code
          permission-contents: write
          permission-workflows: write

      - name: Recheck source identity and tag before publication
        env:
          GH_TOKEN: ${{ steps.release_app_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.fork_preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.fork_preflight.outputs.sha }}
          RELEASE_VERSION: ${{ needs.fork_preflight.outputs.version }}
          UPSTREAM_BASE: ${{ needs.fork_preflight.outputs.upstream_base }}
          UPSTREAM_TAG: ${{ needs.fork_preflight.outputs.upstream_tag }}
          SOURCE_BRANCH: ${{ needs.fork_preflight.outputs.source_branch }}
          BUILD_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
          BUILD_ARTIFACT_RUN_ATTEMPT: ${{ inputs.artifact_run_id != '' && needs.fork_verify_tested_artifact.outputs.build_run_attempt || github.run_attempt }}
        run: |
          set -euo pipefail
          cd release-assets
          RELEASE_VERSION="$RELEASE_VERSION" RELEASE_SHA="$RELEASE_SHA" UPSTREAM_BASE="$UPSTREAM_BASE" UPSTREAM_TAG="$UPSTREAM_TAG" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_ARTIFACT_RUN_ID="$BUILD_ARTIFACT_RUN_ID" BUILD_ARTIFACT_RUN_ATTEMPT="$BUILD_ARTIFACT_RUN_ATTEMPT" \
            node - <<'NODE'
          const { verifyForkBuildArtifactAssets } = require("../.github/scripts/fork-release.cjs");
          verifyForkBuildArtifactAssets({
            directory: process.cwd(),
            version: process.env.RELEASE_VERSION,
            sha: process.env.RELEASE_SHA,
            upstreamBase: process.env.UPSTREAM_BASE,
            upstreamTag: process.env.UPSTREAM_TAG,
            sourceBranch: process.env.SOURCE_BRANCH,
            buildRunId: process.env.BUILD_ARTIFACT_RUN_ID,
            buildRunAttempt: process.env.BUILD_ARTIFACT_RUN_ATTEMPT,
          }).then(() => {
            process.stdout.write("Verified exact Windows, macOS, Android, and Nix build artifacts.\n");
          }).catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
          refs="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$refs" ]]; then
            tag_sha="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
            if [[ -z "$tag_sha" ]]; then tag_sha="$(printf '%s\n' "$refs" | awk 'NF { print $1; exit }')"; fi
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Existing tag $RELEASE_TAG does not point to the authorized release source." >&2
              exit 1
            fi
          fi
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" >/dev/null 2>"$RUNNER_TEMP/release-check.err"; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/release-check.err"; then
            echo "::error::Could not confirm that release $RELEASE_TAG is absent." >&2
            exit 1
          fi
          if [[ -z "$refs" ]]; then
            if ! node - <<'NODE' | gh api --method POST "repos/$GH_REPO/git/refs" --input - >/dev/null 2>"$RUNNER_TEMP/tag-create.err"
          const body = { ref: `refs/tags/${process.env.RELEASE_TAG}`, sha: process.env.RELEASE_SHA };
          process.stdout.write(`${JSON.stringify(body)}\n`);
          NODE
            then
              refs="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
              if [[ -z "$refs" ]]; then
                cat "$RUNNER_TEMP/tag-create.err" >&2
                echo "::error::Could not atomically reserve release tag $RELEASE_TAG." >&2
                exit 1
              fi
            fi
          fi
          refs="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_sha="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [[ -z "$tag_sha" ]]; then tag_sha="$(printf '%s\n' "$refs" | awk 'NF { print $1; exit }')"; fi
          ACTUAL_TAG_SHA="$tag_sha" EXPECTED_TAG_SHA="$RELEASE_SHA" RELEASE_TAG="$RELEASE_TAG" node - <<'NODE'
          const { assertForkReleaseTagTarget } = require("../.github/scripts/fork-release.cjs");
          assertForkReleaseTagTarget({
            tag: process.env.RELEASE_TAG,
            expectedSha: process.env.EXPECTED_TAG_SHA,
            actualSha: process.env.ACTUAL_TAG_SHA,
          });
          NODE
          UPSTREAM_BASE="$UPSTREAM_BASE" UPSTREAM_TAG="$UPSTREAM_TAG" RELEASE_SHA="$RELEASE_SHA" SOURCE_BRANCH="$SOURCE_BRANCH" BUILD_ARTIFACT_RUN_ID="$BUILD_ARTIFACT_RUN_ID" BUILD_ARTIFACT_RUN_ATTEMPT="$BUILD_ARTIFACT_RUN_ATTEMPT" RELEASE_TAG="$RELEASE_TAG" node - <<'NODE' > ../release-notes.md
          const { buildForkReleaseNotes } = require("../.github/scripts/fork-release.cjs");
          process.stdout.write(buildForkReleaseNotes({
            upstreamBase: process.env.UPSTREAM_BASE,
            upstreamTag: process.env.UPSTREAM_TAG,
            sha: process.env.RELEASE_SHA,
            sourceBranch: process.env.SOURCE_BRANCH,
            buildArtifactRunId: process.env.BUILD_ARTIFACT_RUN_ID,
            buildArtifactRunAttempt: process.env.BUILD_ARTIFACT_RUN_ATTEMPT,
            releaseTag: process.env.RELEASE_TAG,
          }));
          NODE

      - name: Create the authorized immutable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.fork_preflight.outputs.tag }}
          RELEASE_NAME: ${{ needs.fork_preflight.outputs.release_name }}
          RELEASE_SHA: ${{ needs.fork_preflight.outputs.sha }}
          SOURCE_BRANCH: ${{ needs.fork_preflight.outputs.source_branch }}
          BUILD_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GH_REPO"
          --title "$RELEASE_NAME"
          --target "$RELEASE_SHA"
          --notes-file release-notes.md

  # Separate job so a re-dispatch of an already published release still advances the branch.
  fork_release_branch:
    name: Advance the latest-release branch
    needs: [fork_preflight, fork_publish]
    if: >-
      github.repository == 'Nitestack/t3code' &&
      github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && inputs.publish == true &&
      !cancelled() &&
      needs.fork_preflight.result == 'success' &&
      (needs.fork_publish.result == 'success' || needs.fork_preflight.outputs.already_published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the release helpers
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git checkout --quiet --detach "$CHECKOUT_REF"

      # GITHUB_TOKEN cannot point refs at a commit whose workflows differ from main.
      # Without the App's workflows grant, a maintainer pushes the tag and branch first.
      - id: branch_app_token
        name: Mint fork release App token
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FORK_SYNC_APP_ID }}
          private-key: ${{ secrets.FORK_SYNC_APP_PRIVATE_KEY }}
          owner: Nitestack
          repositories: t3code
          permission-contents: write
          permission-workflows: write

      - name: Advance the latest-release branch
        env:
          GH_TOKEN: ${{ steps.branch_app_token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.fork_preflight.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref="repos/$GH_REPO/git/ref/heads/release"
          update_ref="repos/$GH_REPO/git/refs/heads/release"
          current_sha="$(gh api "$ref" --jq '.object.sha' 2>"$RUNNER_TEMP/release-ref.err" || true)"
          if [[ -z "$current_sha" ]]; then
            if ! grep -q "HTTP 404" "$RUNNER_TEMP/release-ref.err"; then
              cat "$RUNNER_TEMP/release-ref.err" >&2
              exit 1
            fi
            if printf '{"ref":"refs/heads/release","sha":"%s"}\n' "$RELEASE_SHA" |
              gh api --method POST "repos/$GH_REPO/git/refs" --input - >/dev/null 2>"$RUNNER_TEMP/release-ref-create.err"
            then
              message="Created the release branch at $RELEASE_SHA."
              echo "::notice::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! current_sha="$(gh api "$ref" --jq '.object.sha')"; then
              cat "$RUNNER_TEMP/release-ref-create.err" >&2
              exit 1
            fi
          fi

          compare_status="$(gh api "repos/$GH_REPO/compare/$current_sha...$RELEASE_SHA" --jq '.status')"
          action="$(RELEASE_BRANCH_COMPARE_STATUS="$compare_status" node - <<'NODE'
          const { decideReleaseBranchUpdate } = require("./.github/scripts/fork-release.cjs");
          process.stdout.write(decideReleaseBranchUpdate(process.env.RELEASE_BRANCH_COMPARE_STATUS));
          NODE
          )"
          case "$action" in
            noop)
              message="The release branch already points to $RELEASE_SHA."
              echo "::notice::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              ;;
            skip)
              message="The release branch is newer than or diverged from $RELEASE_SHA; leaving it unchanged."
              echo "::notice::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              ;;
            update)
              if printf '{"sha":"%s","force":false}\n' "$RELEASE_SHA" |
                gh api --method PATCH "$update_ref" --input - >/dev/null 2>"$RUNNER_TEMP/release-ref-update.err"
              then
                message="Advanced the release branch to $RELEASE_SHA."
                echo "::notice::$message"
                echo "$message" >> "$GITHUB_STEP_SUMMARY"
              else
                current_sha="$(gh api "$ref" --jq '.object.sha')"
                compare_status="$(gh api "repos/$GH_REPO/compare/$current_sha...$RELEASE_SHA" --jq '.status')"
                action="$(RELEASE_BRANCH_COMPARE_STATUS="$compare_status" node - <<'NODE'
          const { decideReleaseBranchUpdate } = require("./.github/scripts/fork-release.cjs");
          process.stdout.write(decideReleaseBranchUpdate(process.env.RELEASE_BRANCH_COMPARE_STATUS));
          NODE
          )"
                if [[ "$action" == skip || "$action" == noop ]]; then
                  message="The release branch changed during publication and is no longer behind $RELEASE_SHA; leaving it unchanged."
                  echo "::notice::$message"
                  echo "$message" >> "$GITHUB_STEP_SUMMARY"
                else
                  cat "$RUNNER_TEMP/release-ref-update.err" >&2
                  exit 1
                fi
              fi
              ;;
          esac

  # Picks the commit every later job builds. Nightlies and tag pushes build the
  # triggering commit. Manual stable releases build the commit of the latest
  # published nightly, so stable only ever ships a build that nightly users
  # have already run. Scheduled runs also decide here whether a nightly is due.
  # The PAUSE_NIGHTLY repository variable skips scheduled runs only; every later
  # job needs this one, so a skip here skips the whole run. `update_feed` runs
  # without it and checks the variable itself.
  resolve_commit:
    name: Resolve release commit
    if: github.repository == 'pingdotgg/t3code' && (github.event_name != 'schedule' || vars.PAUSE_NIGHTLY != 'true')
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      nightly_version: ${{ steps.resolve.outputs.nightly_version }}
      has_changes: ${{ steps.resolve.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - id: resolve
        name: Resolve release commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          # Every call here is a read; retry GitHub's transient 5xx and dropped connections.
          retries: 3
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              shouldReleaseNightly,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/check-nightly-release.cjs');

            const dispatchChannel = process.env.DISPATCH_CHANNEL || 'preview';
            const releaseChannel = context.eventName === 'schedule'
              ? 'nightly'
              : context.eventName === 'workflow_dispatch'
                ? dispatchChannel
                : 'stable';

            await assertReleaseSource({ github, context, releaseChannel });

            if (context.eventName === 'schedule') {
              core.setOutput('has_changes', await shouldReleaseNightly({ github, context, core }));
              core.setOutput('ref', context.sha);
            } else if (context.eventName === 'workflow_dispatch' && dispatchChannel === 'stable') {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput('ref', sha);
              core.setOutput('nightly_version', version);
            } else {
              core.setOutput('ref', context.sha);
            }

  preflight:
    name: Preflight
    needs: [resolve_commit]
    if: >-
      github.repository == 'pingdotgg/t3code' &&
      (needs.resolve_commit.result == 'success' && (github.event_name != 'schedule' || needs.resolve_commit.outputs.has_changes == 'true'))
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ needs.resolve_commit.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve_commit.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_VERSION: ${{ needs.resolve_commit.outputs.nightly_version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ needs.resolve_commit.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-preview}" == "nightly" ) ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-preview}" == "preview" ]]; then
            # Manual-only test train: exercises the release flow up to a draft
            # release for a commit end users must never receive. Never scheduled.
            # Same versioning as nightly under its own prerelease identifier.
            # A preview release stays a draft (see "Publish prerelease"), its
            # desktop builds carry no update feed, no updater manifest is
            # attached, and npm gets nothing, so no install can be offered one.
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --channel preview \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=preview" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION:-$NIGHTLY_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases need a version input or a published nightly." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=T3 Code v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      # Share only the verification results, not the large registry metadata cache.
      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          overwrite: true

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

  # Keep tests on their own runners, using the same package split and server
  # shards as CI (test, test_web, test_server in ci.yml). Keep the two in sync.
  test:
    name: Release tests
    needs: [preflight]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/blacksmith-ubuntu-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  # Web browser tests time out when they share a runner with the other package
  # suites: Chromium gets too little CPU and diff workers miss their 10s start budget.
  test_web:
    name: Release web tests ${{ matrix.shard }}
    needs: [preflight]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # Browser tests run source modules; this boots the production chunk graph.
      - name: Boot the built web client
        if: matrix.shard == 1
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  # Server test files run one at a time, so more small runners beat fewer big ones.
  test_server:
    name: Release server tests ${{ matrix.shard }}
    needs: [preflight]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          task-cache-read-token: ${{ secrets.T3_TASK_CACHE_READ_TOKEN }}

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  relay_public_config:
    name: Resolve T3 Connect public config
    # Consumes only the release commit, not preflight's resolved version, so it
    # runs alongside preflight instead of after it. The condition mirrors preflight's.
    needs: [resolve_commit]
    if: >-
      github.repository == 'pingdotgg/t3code' &&
      (needs.resolve_commit.result == 'success' && (github.event_name != 'schedule' || needs.resolve_commit.outputs.has_changes == 'true'))
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 5
    # Previews build any branch, but production admits only main and v* tags.
    # The empty name runs previews with no environment, so their Clerk and relay
    # ids come from .env.example. Everything else matches nightly: the tracing
    # read below needs only repository-level Cloudflare credentials.
    environment:
      name: ${{ inputs.channel != 'preview' && 'production' || '' }}
    outputs:
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve_commit.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3code-relay...

      # The deployed stack's outputs, read from Alchemy's state store without
      # planning or applying. Select the backend explicitly to avoid loading
      # the stack's unrelated provider credentials; suppress informational logs
      # and strip the credential-refresh progress prefix before parsing JSON.
      # Redacted values are persisted as
      # {"__redacted__": "<value>"}; the token is masked before it is written.
      - name: Read production relay tracing config
        shell: bash
        working-directory: infra/relay
        run: |
          set -euo pipefail
          output="$(npx alchemy state read T3CodeRelay/prod/output --backend cloudflare --log-level error --no-input | sed -n '/^{/,$p')"
          field() {
            jq -er --arg key "$1" '.[$key] | if type == "object" then .__redacted__ else . end | select(. != null and . != "")' <<<"$output" \
              || { echo "Relay stack output is missing $1" >&2; exit 1; }
          }
          url="$(field clientTracingUrl)"
          dataset="$(field clientTracingDataset)"
          token="$(field clientTracingToken)"
          echo "::add-mask::$token"
          {
            echo "T3CODE_RELAY_CLIENT_OTLP_TRACES_URL=$url"
            echo "T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET=$dataset"
            echo "T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=$token"
          } > "$RUNNER_TEMP/relay-client-tracing.env"

      - name: Upload relay client tracing config
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing.env
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - id: public_config
        name: Resolve production relay public config
        shell: bash
        env:
          PREVIEW: ${{ inputs.channel == 'preview' }}
        run: |
          set -euo pipefail

          if [[ "$PREVIEW" == "true" ]]; then
            env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
            CLERK_PUBLISHABLE_KEY="$(env_example CLERK_PUBLISHABLE_KEY)"
            CLERK_JWT_TEMPLATE="$(env_example CLERK_JWT_TEMPLATE)"
            CLERK_CLI_OAUTH_CLIENT_ID="$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            RELAY_DOMAIN="$(sed -n 's|^T3CODE_RELAY_URL=https://||p' .env.example)"
          fi

          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          required=(
            relay_domain
            CLERK_PUBLISHABLE_KEY
            CLERK_JWT_TEMPLATE
            CLERK_CLI_OAUTH_CLIENT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required relay deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "clerk_publishable_key=$CLERK_PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=$CLERK_JWT_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=$CLERK_CLI_OAUTH_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "relay_url=https://$relay_domain" >> "$GITHUB_OUTPUT"

  # The platform-independent JS (server bundle, web client, Electron main) is
  # built exactly once here and handed to every platform job as `js-bundle`.
  # The relay/Clerk values are baked into the bundle, so they belong to this
  # job rather than to the packaging jobs.
  build_bundle:
    name: Build JS bundle
    # Same gating as relay_public_config: only the release commit is needed, so
    # this runs alongside preflight. See the condition comment there.
    needs: [preflight, relay_public_config]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success') }}
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      npm_launcher_artifact_id: ${{ steps.npm_launcher.outputs.artifact-id }}
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # pnpm checks the lockfile and policy before reusing this result. A missing
      # artifact leaves the cache empty, so installation runs the checks again.
      - name: Download dependency verification
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata

      - name: Download relay client tracing config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # Older release refs lack build:desktop:bundle and use the full build,
      # which compiles the Linux browser secret helper and needs libsecret.
      - name: Check bundle-only build support
        id: bundle_build
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - if: steps.bundle_build.outputs.script == 'build:desktop'
        uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      # Runs t3#build (which depends on @t3tools/web#build) and the desktop
      # bundle, so apps/server/dist holds the server bundle plus the web client
      # and apps/desktop/dist-electron the Electron main. build:desktop:bundle
      # skips the Linux browser secret helper, which this artifact does not
      # carry; each Linux package job compiles its own per arch.
      # The release channel is already stable, nightly, or preview. Builds in
      # other repositories report "dev" telemetry.
      - name: Build JS bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: ${{ github.repository == 'pingdotgg/t3code' && needs.preflight.outputs.release_channel || 'dev' }}
        run: vp run ${{ steps.bundle_build.outputs.script }}

      # Two paths under apps/ so the artifact root is apps/; consumers download
      # into `apps` to restore both at their original locations.
      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # publish_cli publishes this exact tarball, so the trusted publisher
      # needs no workspace checkout or install. It is version-matched here.
      - name: Build the npm launcher
        run: node scripts/build-npm-launcher.ts --version "${{ needs.preflight.outputs.version }}" --output-dir npm-packages

      # GitHub allows a failed-jobs rerun for 30 days. publish_cli downloads
      # this upload by its ID, which a publish_cli-only rerun keeps.
      - name: Upload the npm launcher
        id: npm_launcher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-launcher
          path: npm-packages/t3.tgz
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # One job per platform and architecture (see release-desktop.yml), each
  # gated only on the JS bundle. Windows targets build on Linux and run their
  # native checks on a Windows runner of their own architecture.
  # The Windows jobs also embed the same-arch Linux CLI archive as the WSL
  # runtime; they wait for that artifact partway through instead of for the
  # whole Linux job. Every job builds the desktop app; all but macOS x64 also
  # build the CLI archive for their platform, so a target either ships fully or
  # not at all.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: macOS arm64
      runner: blacksmith-12vcpu-macos-26
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: true
      # desktop_mac_x64 saves the shared pnpm store; this job finishes last.
      save_pnpm_store: false

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: macOS x64
      runner: blacksmith-12vcpu-macos-26
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      # No CLI archive: Node single-executables are unsupported on x64 macOS
      # (the SEA docs list macOS as arm64 only) and the built binary segfaults
      # on start. The x64 desktop app is Electron and unaffected.
      cli_archive: false

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: Linux x64
      runner: blacksmith-32vcpu-ubuntu-2404
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  # node-pty has no Linux prebuild and compiles from source, so the arm64 app
  # and archive are built on arm64 hardware rather than cross-built.
  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: Linux arm64
      runner: blacksmith-16vcpu-ubuntu-2404-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true

  # The Windows jobs start with the other platforms and wait for the same-arch
  # Linux CLI archive after their other setup. Packaging is mostly CPU and
  # small-file work, which Linux runners do faster than Windows ones, so both
  # Windows targets build and sign on Linux and only the native checks run on
  # Windows.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: Windows x64
      runner: blacksmith-16vcpu-ubuntu-2404
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  desktop_win_arm64:
    name: Desktop Windows arm64
    needs: [preflight, relay_public_config, build_bundle]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.build_bundle.result == 'success') }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      clerk_publishable_key: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.relay_public_config.outputs.relay_url }}
      label: Windows arm64
      runner: blacksmith-16vcpu-ubuntu-2404
      verify_runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true

  release:
    name: Publish GitHub Release
    needs:
      [
        preflight,
        relay_public_config,
        quality,
        test,
        test_web,
        test_server,
        desktop_mac_arm64,
        desktop_mac_x64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.quality.result == 'success' && needs.test.result == 'success' && needs.test_web.result == 'success' && needs.test_server.result == 'success' && needs.desktop_mac_arm64.result == 'success' && needs.desktop_mac_x64.result == 'success' && needs.desktop_linux_x64.result == 'success' && needs.desktop_linux_arm64.result == 'success' && needs.desktop_win_x64.result == 'success' && needs.desktop_win_arm64.result == 'success') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      # Release notes read PR bodies and authors.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          # Release notes need history back to the previous tag, not file contents.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      # Overlaps the artifact downloads. The wait below ends it before any
      # workspace script runs, so the Play key lives only in this process.
      # `exec` lets the runner's stop signals reach node directly.
      - id: android_apk
        name: Download nightly Android APK
        if: needs.preflight.outputs.release_channel == 'nightly'
        background: true
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.t3tools.t3code
          APK_OUTPUT_DIR: ${{ runner.temp }}/android-apk
        run: |
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            exec node .github/scripts/mirror-play-apk.cjs
          fi

      - name: Download all desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download all CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from the
      # signed bytes that get uploaded, never from an earlier stage.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Always runs, even after a failed step, and keeps that failure.
      - name: Wait for nightly Android APK
        wait: android_apk

      # The desktop build omits the publish config for preview versions, so
      # electron-builder emits no updater manifests for them. Refuse to publish
      # if one shows up anyway: a `latest*.yml` or `nightly*.yml` on a preview
      # release is what would let a stable or nightly install update onto it.
      - name: Refuse updater metadata on preview releases
        if: needs.preflight.outputs.release_channel == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob extglob
          # builder-debug.yml is electron-builder's config dump, not a feed.
          updater_files=(release-assets/!(builder-debug).yml release-assets/*.blockmap)
          if [[ ${#updater_files[@]} -ne 0 ]]; then
            printf 'Preview releases must not carry updater metadata, found: %s\n' "${updater_files[*]}" >&2
            exit 1
          fi

      # electron-updater reads one manifest per platform and channel and picks
      # the file entry whose name carries the running arch. Require every
      # platform's two build jobs to have produced matching metadata before
      # merging it, so a successful release can never strand one architecture.
      - name: Merge desktop updater manifests
        if: needs.preflight.outputs.release_channel != 'preview'
        run: node scripts/merge-release-update-manifests.ts release-assets

      # Updater manifests and blockmaps are what electron-updater consumes.
      # They are only listed for channels an updater is meant to follow.
      - id: release_files
        name: Resolve release asset list
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo 'release-assets/*.dmg'
            echo 'release-assets/*.zip'
            echo 'release-assets/*.AppImage'
            echo 'release-assets/*.deb'
            echo 'release-assets/*.exe'
            if [[ "${{ needs.preflight.outputs.release_channel }}" != "preview" ]]; then
              echo 'release-assets/*.blockmap'
              echo 'release-assets/*.yml'
            fi
            echo 'release-assets/*.tar.gz'
            # A failed or timed-out fetch can leave partial bytes, so list the APK
            # only when this attempt's fetch succeeded and Play had one ready.
            if [[ "${{ steps.android_apk.outcome }}" == "success" ]]; then
              for apk in "$RUNNER_TEMP"/android-apk/*.apk; do
                [[ -f "$apk" ]] && echo "$apk"
              done
            fi
            echo 'release-assets/SHA256SUMS'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # A short model summary over GitHub's full list. Without a notes file, the
      # release falls back to GitHub's generated notes.
      - name: Write release notes
        if: needs.preflight.outputs.release_channel != 'preview' && needs.preflight.outputs.previous_tag != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-release-notes.ts \
            --repository "${{ github.repository }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --ref "${{ needs.preflight.outputs.ref }}" \
            --previous-tag "${{ needs.preflight.outputs.previous_tag }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --output release-notes.md
          if [[ -f release-notes.md ]]; then
            cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # A preview release gets a warning instead of generated notes. Generated
      # notes would list every commit since the previous preview, which is
      # unmerged branch history no one should read as a changelog, and would
      # make the release look like any other build to someone browsing the
      # releases page.
      - name: Write preview release notes
        if: needs.preflight.outputs.release_channel == 'preview'
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          > [!WARNING]
          > **This is a preview build. Do not install it unless you know exactly why you are here.**
          >
          > Preview builds are cut by maintainers from unreleased branches to exercise the release pipeline. They can be broken, receive no fixes, are never offered as updates, and are not supported. If you want T3 Code, install the [latest release](https://github.com/pingdotgg/t3code/releases/latest) or a nightly instead.

          Built from `${{ needs.preflight.outputs.ref }}`.
          EOF

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: ${{ hashFiles('release-notes.md') == '' }}
          body_path: ${{ hashFiles('release-notes.md') != '' && 'release-notes.md' || '' }}
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: ${{ needs.preflight.outputs.release_channel != 'preview' }}
          body_path: ${{ needs.preflight.outputs.release_channel == 'preview' && 'release-notes.md' || '' }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      # The action keeps a stable release a draft until its assets finish uploading, but publishes a
      # prerelease first. Desktop clients update connected servers from the CLI archives as soon as
      # they see the release, so a prerelease also goes public only once every asset is attached.
      # Previews stay drafts, because a draft has no git tag. releases.atom lists the 10 newest tags,
      # a day's `preview` tags can sort above its `nightly` ones, and older updaters find nightlies only there.
      - name: Publish prerelease
        if: needs.preflight.outputs.is_prerelease == 'true' && needs.preflight.outputs.release_channel != 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # A nightly install finds updates in releases.atom, which holds the 10 newest git tags of any
  # kind, so a burst of other tags hides every nightly. The `update-feed` release is the fixed URL
  # newer installs also read. Every unpaused scheduled tick and every nightly repairs it, then fails when
  # the feed's first nightly is not the newest one. See docs/operations/release.md#update-feed.
  update_feed:
    name: Check the update feed
    needs: [preflight, release]
    if: ${{ !cancelled() && github.repository == 'pingdotgg/t3code' && ((github.event_name == 'schedule' && vars.PAUSE_NIGHTLY != 'true') || needs.preflight.outputs.release_channel == 'nightly') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - id: feed
        name: Read the update feed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          retries: 3
          script: |
            const { readNightlyUpdateFeed } = require('./.github/scripts/check-nightly-release.cjs');
            const { tag, pointerTag, feedNightly, feedTags } = await readNightlyUpdateFeed({ github, context });
            if (!tag) return;
            core.info(`Newest nightly: ${tag}. Pointer: ${pointerTag}. Feed: ${feedTags?.join(', ')}.`);
            core.setOutput('tag', tag);
            core.setOutput('pointer_stale', pointerTag !== tag);
            core.setOutput('feed', feedTags === undefined ? 'unreadable' : feedNightly === tag ? 'ok' : 'hidden');

      - name: Point the update feed at the newest nightly
        if: steps.feed.outputs.pointer_stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "The desktop updater reads this release to find the newest nightly. Do not delete it. See docs/operations/release.md."
          gh release upload update-feed nightly.json --clobber

      # Every run, because the pointer can be current while the release's flags are wrong. A draft's
      # files are not public, and a release marked "latest" is the one stable installs update to.
      - name: Keep the update feed release public and never latest
        if: steps.feed.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit update-feed --draft=false --prerelease --latest=false

      # An unreadable feed says nothing about its tags and the next tick reads it again, so only a
      # feed that was read and names another nightly first fails the run.
      - name: Fail when the feed hides the newest nightly
        if: steps.feed.outputs.tag != '' && steps.feed.outputs.feed != 'ok'
        env:
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
          FEED: ${{ steps.feed.outputs.feed }}
        run: |
          if [[ "$FEED" == "unreadable" ]]; then
            echo "::warning::releases.atom could not be read, so this run did not check it."
            exit 0
          fi
          echo "::error::The first nightly in releases.atom is not $RELEASE_TAG. Nightly installs older than 0.1.10-nightly.20261112.4603 cannot reach it, and neither can later builds that do not read the pointer when the feed names an older nightly. A preview from a branch not rebased onto main is the usual cause. See docs/operations/release.md#update-feed."
          exit 1

  # The `t3` npm package is a launcher that downloads this version's CLI
  # archive from the GitHub Release, so it publishes only once that release
  # exists. A preview release stays a draft, whose files are not public, so
  # a preview never publishes the launcher.
  publish_cli:
    name: Publish CLI to npm
    needs: [preflight, build_bundle, release]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel != 'preview') }}
    runs-on: ubuntu-24.04 # blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      # Only what setup-ci-deps reads to install the project's Node and npm.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /.github/actions/setup-ci-deps/
            /package.json
            /pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      # Bind to build_bundle's exact upload: a name lookup takes the newest
      # same-name artifact, and an empty ID downloads every artifact in the
      # run. A later same-name upload hides this ID, so the download fails.
      - name: Check the npm launcher artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build_bundle.outputs.npm_launcher_artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_bundle gave no valid npm-launcher artifact ID: '$ARTIFACT_ID'." >&2
            exit 1
          fi

      - name: Download the npm launcher
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build_bundle.outputs.npm_launcher_artifact_id }}
          path: npm-packages
          digest-mismatch: error

      - name: Check the npm launcher version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          built="$(tar -xzOf npm-packages/t3.tgz package/package.json | jq -r .version)"
          if [[ "$built" != "$RELEASE_VERSION" ]]; then
            echo "::error::npm-launcher holds t3@$built, expected t3@$RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Publish the npm launcher
        env:
          DIST_TAG: ${{ needs.preflight.outputs.cli_dist_tag }}
        run: |
          # The ./ keeps npm from reading the path as a GitHub owner/repo spec.
          if ! npm publish --access public --tag "$DIST_TAG" --provenance ./npm-packages/t3.tgz; then
            echo "::error::npm publish failed. Make sure package t3 has a trusted publisher registered for .github/workflows/release.yml (see docs/operations/release.md)." >&2
            exit 1
          fi

  publish_aur:
    name: Publish AUR package
    needs: [preflight, release]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel != 'preview') }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # Vercel builds the hosted web app while the desktop jobs run. `--skip-domain`
  # keeps the custom domains (the channel and router domains) on the previous
  # deployment until deploy_web aliases them, after the GitHub Release. It does
  # still move the project's own *.vercel.app production hostname at build time.
  # That hostname sits behind Vercel SSO and is not a user channel, so the
  # npm-before-client order in docs/operations/release.md holds for users.
  build_web:
    name: Build hosted web app
    needs: [preflight, relay_public_config]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' && needs.preflight.outputs.release_channel != 'preview') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      T3CODE_WEB_ROUTER_URL: ${{ vars.T3CODE_WEB_ROUTER_URL }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts... --filter=@t3tools/web...

      - name: Download relay client tracing config
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relay-client-tracing-config
          path: ${{ runner.temp }}/relay-client-tracing

      - name: Load relay client tracing config
        shell: bash
        run: |
          config_path="$RUNNER_TEMP/relay-client-tracing/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          echo "::add-mask::$tracing_token"
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Refresh release lockfile
        run: vp install --lockfile-only --ignore-scripts

      - id: deploy
        name: Build staged deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "Missing one or more required Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID." >&2
            exit 1
          fi

          router_url="${T3CODE_WEB_ROUTER_URL:-https://app.t3.codes}"
          if [[ "${{ needs.preflight.outputs.release_channel }}" == "stable" ]]; then
            channel_name="latest"
          else
            channel_name="nightly"
          fi

          echo "Building hosted web app for $channel_name channel."
          deployment_output="$(
            vp dlx vercel@53.1.1 deploy \
              --archive=tgz \
              --prod \
              --skip-domain \
              --yes \
              --token "$VERCEL_TOKEN" \
              --scope "${VERCEL_TEAM_SLUG:-$VERCEL_ORG_ID}" \
              --build-env "APP_VERSION=${{ needs.preflight.outputs.version }}" \
              --build-env "T3CODE_CLERK_PUBLISHABLE_KEY=${T3CODE_CLERK_PUBLISHABLE_KEY:-}" \
              --build-env "T3CODE_CLERK_JWT_TEMPLATE=${T3CODE_CLERK_JWT_TEMPLATE:-}" \
              --build-env "T3CODE_CLERK_CLI_OAUTH_CLIENT_ID=${T3CODE_CLERK_CLI_OAUTH_CLIENT_ID:-}" \
              --build-env "T3CODE_RELAY_URL=${T3CODE_RELAY_URL:-}" \
              --build-env "T3CODE_RELAY_CLIENT_OTLP_TRACES_URL=${T3CODE_RELAY_CLIENT_OTLP_TRACES_URL:-}" \
              --build-env "T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET=${T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET:-}" \
              --build-env "T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=${T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN:-}" \
              --build-env "VITE_HOSTED_APP_URL=$router_url" \
              --build-env "VITE_HOSTED_APP_CHANNEL=$channel_name"
          )"
          printf '%s\n' "$deployment_output"
          # Vercel can print lockfile warnings to stdout before the deployment URL.
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -E '^https://[[:alnum:].-]+\.vercel\.app$')"
          if [[ "$deployment_url" == *$'\n'* ]]; then
            echo "Vercel returned multiple deployment URLs." >&2
            exit 1
          fi
          echo "Staged $deployment_url."
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

  deploy_web:
    name: Deploy hosted web app
    needs: [preflight, build_web, release, publish_cli]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_web.result == 'success' && needs.release.result == 'success' && needs.publish_cli.result == 'success' && needs.preflight.outputs.release_channel != 'preview') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      DEPLOYMENT_URL: ${{ needs.build_web.outputs.deployment_url }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      T3CODE_WEB_ROUTER_URL: ${{ vars.T3CODE_WEB_ROUTER_URL }}
      T3CODE_WEB_LATEST_DOMAIN: ${{ vars.T3CODE_WEB_LATEST_DOMAIN }}
      T3CODE_WEB_NIGHTLY_DOMAIN: ${{ vars.T3CODE_WEB_NIGHTLY_DOMAIN }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      # Only what setup-ci-deps reads to install vp and Node. The alias call
      # names its deployment and scope, so it reads nothing else from the repo.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /.github/actions/setup-ci-deps/
            /package.json
            /pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: false

      - name: Alias channel
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "Build hosted web app did not report a deployment URL." >&2
            exit 1
          fi

          router_url="${T3CODE_WEB_ROUTER_URL:-https://app.t3.codes}"
          latest_domain="${T3CODE_WEB_LATEST_DOMAIN:-latest.app.t3.codes}"
          nightly_domain="${T3CODE_WEB_NIGHTLY_DOMAIN:-nightly.app.t3.codes}"
          router_domain="${router_url#http://}"
          router_domain="${router_domain#https://}"
          router_domain="${router_domain%%/*}"

          if [[ "${{ needs.preflight.outputs.release_channel }}" == "stable" ]]; then
            channel_domain="$latest_domain"
            channel_name="latest"
          else
            channel_domain="$nightly_domain"
            channel_name="nightly"
          fi

          vercel_scope_args=(--scope "${VERCEL_TEAM_SLUG:-$VERCEL_ORG_ID}")

          echo "Aliasing $DEPLOYMENT_URL to $channel_domain."
          vp dlx vercel@53.1.1 alias set "$DEPLOYMENT_URL" "$channel_domain" \
            --token "$VERCEL_TOKEN" \
            "${vercel_scope_args[@]}"

          if [[ "$channel_name" == "latest" && -n "$router_domain" && "$router_domain" != "$channel_domain" ]]; then
            echo "Aliasing $DEPLOYMENT_URL to router domain $router_domain."
            vp dlx vercel@53.1.1 alias set "$DEPLOYMENT_URL" "$router_domain" \
              --token "$VERCEL_TOKEN" \
              "${vercel_scope_args[@]}"
          fi

  # Same split as the web app: build a production deployment early, then
  # promote it to t3.codes once the release it links to exists. As above, the
  # project's own *.vercel.app hostname moves at build time.
  build_marketing:
    name: Build marketing site
    needs: [preflight]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.release_channel == 'nightly') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      project_id: ${{ steps.deploy.outputs.project_id }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/marketing...

      - id: deploy
        name: Build staged deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" ]]; then
            echo "Missing one or more required Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID." >&2
            exit 1
          fi

          VERCEL_PROJECT_ID="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/t3code-marketing?teamId=$VERCEL_ORG_ID" \
              | jq --exit-status --raw-output '.id'
          )"
          export VERCEL_PROJECT_ID

          deployment_output="$(
            vp dlx vercel@53.1.1 deploy \
              --archive=tgz \
              --prod \
              --skip-domain \
              --yes \
              --token "$VERCEL_TOKEN" \
              --scope "${VERCEL_TEAM_SLUG:-$VERCEL_ORG_ID}"
          )"
          printf '%s\n' "$deployment_output"
          # Vercel can print lockfile warnings to stdout before the deployment URL.
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -E '^https://[[:alnum:].-]+\.vercel\.app$')"
          if [[ "$deployment_url" == *$'\n'* ]]; then
            echo "Vercel returned multiple deployment URLs." >&2
            exit 1
          fi
          echo "Staged $deployment_url."
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "project_id=$VERCEL_PROJECT_ID" >> "$GITHUB_OUTPUT"

  deploy_marketing:
    name: Deploy marketing site
    needs: [preflight, build_marketing, release]
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.build_marketing.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'nightly') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      DEPLOYMENT_URL: ${{ needs.build_marketing.outputs.deployment_url }}
      VERCEL_PROJECT_ID: ${{ needs.build_marketing.outputs.project_id }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          install: false

      - name: Promote marketing site
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "Build marketing site did not report a deployment URL." >&2
            exit 1
          fi

          echo "Promoting $DEPLOYMENT_URL."
          vp dlx vercel@53.1.1 promote "$DEPLOYMENT_URL" \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "${VERCEL_TEAM_SLUG:-$VERCEL_ORG_ID}"

  finalize:
    name: Finalize release
    if: ${{ github.repository == 'pingdotgg/t3code' && (!failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable') }}
    needs: [preflight, release]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: app_bot
        name: Resolve GitHub App bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts... --filter=@t3tools/oxlint-plugin-t3code...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit --no-verify -m "chore(release): prepare $RELEASE_TAG"

          # main moves while this job runs, so a rejected push rebases and retries.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto latest main."
            git pull --rebase origin main
          done

          echo "Could not push the version bump after 5 attempts." >&2
          exit 1

  announce_discord:
    name: Announce release on Discord
    if: >-
      github.repository == 'pingdotgg/t3code' &&
      (always() && !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.release_channel != 'preview' && needs.relay_public_config.result == 'success' && needs.release.result == 'success' && needs.deploy_web.result == 'success' && (needs.finalize.result == 'success' || needs.finalize.result == 'skipped'))
    needs: [preflight, relay_public_config, release, deploy_web, finalize]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Read published release notes
        if: needs.preflight.outputs.is_prerelease == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
        run: |
          if [ "$RELEASE_CHANNEL" = 'nightly' ]; then
            if ! gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > "$RUNNER_TEMP/discord-release-notes.md"; then
              : > "$RUNNER_TEMP/discord-release-notes.md"
              echo '::warning::Could not read published release notes; announcing without a changelog.'
            fi
          else
            : > "$RUNNER_TEMP/discord-release-notes.md"
          fi

      - name: Announce prerelease on Discord
        if: needs.preflight.outputs.is_prerelease == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_NIGHTLY_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts prerelease \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}" \
            --release-notes-file "$RUNNER_TEMP/discord-release-notes.md"

      - name: Announce latest release on Discord
        if: needs.preflight.outputs.make_latest == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_LATEST_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts latest \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}"
