name: Nitestack Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable app version (defaults to the app configuration)
        type: string
        required: false
  push:
    tags:
      - "t3-android-v*"

permissions:
  contents: read

concurrency:
  group: mobile-android-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android APK
    if: >-
      github.repository == 'Nitestack/t3code' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_VARIANT: android-fork
      EXPO_NO_DOTENV: "1"
      EXPO_NO_GIT_STATUS: "1"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Android app version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#t3-android-v}"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$version" ]; then
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Android app version must be stable MAJOR.MINOR.PATCH."
              exit 1
            fi
            printf 'T3CODE_MOBILE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          fi

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Setup Vite+ and install mobile dependencies
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm exec expo config --json | node -e 'const fs = require("node:fs"); const c = JSON.parse(fs.readFileSync(0, "utf8")); fs.appendFileSync(process.env.GITHUB_ENV, "T3_ANDROID_EXPECTED_VERSION_NAME=" + c.version + "\nT3_ANDROID_EXPECTED_VERSION_CODE=" + c.android.versionCode + "\n");'
          pnpm exec expo prebuild --clean --platform android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/t3code-nitestack-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "T3_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build and verify signed APK
        working-directory: apps/mobile/android
        env:
          T3_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          T3_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          T3_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain

          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          expected_cert_sha256="$(keytool -exportcert -keystore "$T3_ANDROID_KEYSTORE_PATH" -alias "$T3_ANDROID_KEY_ALIAS" -storepass "$T3_ANDROID_KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          apk_cert_sha256="$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$apk_cert_sha256" ] || [ "$apk_cert_sha256" != "$expected_cert_sha256" ]; then
            echo "::error::APK signature does not match the configured upload keystore."
            exit 1
          fi

          badging="$("$build_tools/aapt" dump badging "$apk")"
          package_info="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p")"
          read -r package_name version_code version_name <<< "$package_info"
          if [ "$package_name" != "com.nitestack.t3code" ]; then
            echo "::error::Unexpected APK application id: $package_name"
            exit 1
          fi
          if [ "$version_name" != "$T3_ANDROID_EXPECTED_VERSION_NAME" ] || [ "$version_code" != "$T3_ANDROID_EXPECTED_VERSION_CODE" ]; then
            echo "::error::APK version does not match the selected Android release version."
            exit 1
          fi

          output_dir="../android-fork-artifacts"
          mkdir -p "$output_dir"
          apk_name="t3-code-nitestack-${version_name}.apk"
          cp "$apk" "$output_dir/$apk_name"
          (cd "$output_dir" && sha256sum "$apk_name" > "$apk_name.sha256")
          node -e 'const fs = require("node:fs"); const [file, appId, versionCode, versionName, ref, sha, shaName] = process.argv.slice(1); fs.writeFileSync(file, JSON.stringify({ applicationId: appId, versionCode: Number(versionCode), versionName, sha256: fs.readFileSync(shaName, "utf8").split(" ")[0], gitRef: ref, gitSha: sha }, null, 2) + "\n");' \
            "$output_dir/metadata.json" "$package_name" "$version_code" "$version_name" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$output_dir/$apk_name.sha256"

      - name: Upload APK, checksum, and version metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-code-nitestack-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/mobile/android-fork-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to GitHub Release
    needs: build
    if: >-
      github.repository == 'Nitestack/t3code' && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/t3-android-v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3-code-nitestack-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "T3 Code Android ${RELEASE_TAG#t3-android-v}" \
              --notes "Signed Nitestack Android APK with SHA-256 and version metadata." \
              --repo "$GH_REPO"
          fi
